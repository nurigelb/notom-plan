<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="tennis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#65a30d" />
    </linearGradient>
    <linearGradient id="violin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Three interlocking rings/badges representing Tennis, Violin, AI -->
  <circle cx="176" cy="196" r="76" fill="none" stroke="url(#tennis)" stroke-width="22" />
  <circle cx="336" cy="196" r="76" fill="none" stroke="url(#violin)" stroke-width="22" />
  <circle cx="256" cy="332" r="76" fill="none" stroke="url(#ai)" stroke-width="22" />
  <!-- Center spark -->
  <circle cx="256" cy="242" r="18" fill="#f8fafc" />
</svg>

